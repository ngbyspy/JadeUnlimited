[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jade-unlimited"
version = "0.1.3"
description = "基于 OpenCV 的星穹铁道三星五费翡翠「黑市主理人」自动识别与交易工具"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "mss>=10,<11",
]

[project.scripts]
jade-unlimited = "jade_unlimited.app:main"

[tool.setuptools.package-data]
jade_unlimited = ["assets/*.png"]
